spring.application.name=servicehub

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/servicehub
spring.datasource.username=servicehub
spring.datasource.password=servicehub_dev
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true

# Logs para diagnóstico
logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.flyway=DEBUG

# Servidor
server.port=8080
