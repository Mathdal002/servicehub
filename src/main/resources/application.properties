spring.application.name=servicehub

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/servicehub
spring.datasource.username=servicehub
spring.datasource.password=servicehub_dev
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true

# Servidor
server.port=8080
