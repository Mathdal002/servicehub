
services:
  postgres:
    image: postgres:17
    container_name: servicehub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: servicehub
      POSTGRES_USER: servicehub
      POSTGRES_PASSWORD: servicehub_dev
    ports:
      - "5433:5432"
    volumes:
      - servicehub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servicehub -d servicehub"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  servicehub_postgres_data:
